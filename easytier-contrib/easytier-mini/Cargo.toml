[package]
name = "easytier-mini"
description = "Minimal native EasyTier node with TCP/UDP tunnels, TUN and UDP hole punching."
version = "2.7.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
build = "build.rs"

[features]
# Optional capabilities; the default compact TCP/UDP build stays unchanged.
websocket = ["easytier/websocket"]
# Enable TXT/SRV records and DNS fallback through the existing native resolver.
dns-resolver = ["easytier/dns-resolver"]

[dependencies]
anyhow.workspace = true
easytier = { workspace = true, features = [
    "aes-gcm",
    "dhcp-ipv4",
    "logging",
    "icmp-proxy",
    "proxy-cidr-monitor",
    "smoltcp",
    "tun",
    "web-client",
] }
tokio = { workspace = true, features = ["macros", "rt", "signal"] }
